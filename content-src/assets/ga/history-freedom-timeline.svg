<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <rect width="600" height="260" fill="#ffffff"/>
  <text x="300" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Freedom struggle: key years</text>
  <line x1="30" y1="130" x2="570" y2="130" stroke="#444" stroke-width="3"/>
  <g fill="#c0392b">
    <circle cx="40" cy="130" r="6"/><circle cx="110" cy="130" r="6"/><circle cx="180" cy="130" r="6"/><circle cx="250" cy="130" r="6"/>
    <circle cx="320" cy="130" r="6"/><circle cx="390" cy="130" r="6"/><circle cx="460" cy="130" r="6"/><circle cx="555" cy="130" r="6"/>
  </g>
  <g fill="#222" text-anchor="middle" font-weight="bold">
    <text x="40" y="112">1857</text><text x="110" y="158">1885</text><text x="180" y="112">1905</text><text x="250" y="158">1919</text>
