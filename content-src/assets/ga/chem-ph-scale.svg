<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <rect width="560" height="220" fill="#ffffff"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">The pH scale</text>
  <g>
    <rect x="25" y="70" width="34" height="40" fill="#d7263d"/>
    <rect x="59" y="70" width="34" height="40" fill="#e4572e"/>
    <rect x="93" y="70" width="34" height="40" fill="#f08a24"/>
    <rect x="127" y="70" width="34" height="40" fill="#f5b700"/>
    <rect x="161" y="70" width="34" height="40" fill="#f2d43d"/>
    <rect x="195" y="70" width="34" height="40" fill="#c5d94a"/>
    <rect x="229" y="70" width="34" height="40" fill="#8fc93a"/>
    <rect x="263" y="70" width="34" height="40" fill="#4caf50"/>
    <rect x="297" y="70" width="34" height="40" fill="#2a9d8f"/>
    <rect x="331" y="70" width="34" height="40" fill="#2e86ab"/>
    <rect x="365" y="70" width="34" height="40" fill="#3066be"/>
    <rect x="399" y="70" width="34" height="40" fill="#4b3f9e"/>
    <rect x="433" y="70" width="34" height="40" fill="#5e2b97"/>
    <rect x="467" y="70" width="34" height="40" fill="#6a1b7a"/>
    <rect x="501" y="70" width="34" height="40" fill="#4a1259"/>
  </g>
  <g fill="#222" text-anchor="middle">
    <text x="42" y="128">0</text><text x="110" y="128">2</text><text x="178" y="128">4</text><text x="246" y="128">6</text>
    <text x="280" y="128" font-weight="bold">7</text><text x="314" y="128">8</text><text x="382" y="128">10</text><text x="450" y="128">12</text><text x="518" y="128">14</text>
  </g>
  <text x="100" y="58" text-anchor="middle" fill="#d7263d" font-weight="bold">← more acidic</text>
  <text x="280" y="58" text-anchor="middle" fill="#2e7d32" font-weight="bold">neutral</text>
  <text x="460" y="58" text-anchor="middle" fill="#4b3f9e" font-weight="bold">more basic →</text>
  <g fill="#333" font-size="11">
    <text x="110" y="155" text-anchor="middle">Lemon juice ≈ 2</text>
    <text x="280" y="155" text-anchor="middle">Pure water = 7</text>
    <text x="300" y="175" text-anchor="middle">Blood ≈ 7.4</text>
    <text x="400" y="155" text-anchor="middle">Milk of magnesia ≈ 10</text>
  </g>
  <text x="280" y="205" text-anchor="middle" fill="#555" font-size="11">Each step of 1 = ten times change in H⁺ concentration</text>
</svg>
