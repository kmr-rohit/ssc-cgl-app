  <rect x="430" y="50" width="120" height="200" rx="8" fill="#d6eaff"/>
  <text x="490" y="150" text-anchor="middle" fill="#1d4f91" font-weight="bold">Bay of Bengal</text>
  <rect x="200" y="60" width="160" height="180" rx="8" fill="#f3ead9" stroke="#b08a4a"/>
  <text x="280" y="155" text-anchor="middle" fill="#6b4f1d">Western Ghats /</text>
  <text x="280" y="172" text-anchor="middle" fill="#6b4f1d">central highlands</text>
  <g stroke="#2a6fdb" stroke-width="3" fill="#2a6fdb">
    <line x1="200" y1="95" x2="140" y2="95"/><polygon points="132,95 144,89 144,101"/>
    <line x1="200" y1="125" x2="140" y2="125"/><polygon points="132,125 144,119 144,131"/>
    <line x1="360" y1="85" x2="420" y2="85"/><polygon points="428,85 416,79 416,91"/>
