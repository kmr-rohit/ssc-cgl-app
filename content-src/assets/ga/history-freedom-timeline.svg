    <text x="320" y="80">Non-Cooperation</text><text x="320" y="96">Movement</text>
    <text x="390" y="176">Dandi March /</text><text x="390" y="190">Civil Disobedience</text>
    <text x="460" y="96">Quit India</text>
    <text x="555" y="176">Independence</text>
