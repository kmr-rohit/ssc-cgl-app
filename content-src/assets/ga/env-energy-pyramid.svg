<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="560" height="320" fill="#ffffff"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Energy pyramid and the 10% law</text>
  <polygon points="80,280 480,280 430,220 130,220" fill="#7cc576"/>
  <polygon points="130,215 430,215 380,155 180,155" fill="#b5d96b"/>
  <polygon points="180,150 380,150 330,90 230,90" fill="#f2c94c"/>
  <polygon points="230,85 330,85 280,40" fill="#f2994a"/>
  <g fill="#222" text-anchor="middle">
    <text x="280" y="255">Producers (plants) 10,000 J</text>
    <text x="280" y="190">Primary consumers 1,000 J</text>
    <text x="280" y="125">Secondary 100 J</text>
    <text x="280" y="76" font-size="11">Top 10 J</text>
  </g>
  <text x="280" y="305" text-anchor="middle" fill="#555" font-size="12">Only about 10% of energy passes to the next level (Lindeman). Illustrative values.</text>
</svg>
